<!DOCTYPE html>
<html>
<body>
    <h2>Test API Connection</h2>
    <button onclick="testAPI()">Test API</button>
    <pre id="result"></pre>

    <script>
    async function testAPI() {
        try {
            const response = await fetch('http://127.0.0.1:5000/api/awareness-tips');
            const data = await response.json();
            document.getElementById('result').textContent = 
                '✅ Connected!\n' + JSON.stringify(data, null, 2);
        } catch (error) {
            document.getElementById('result').textContent = 
                '❌ Error: ' + error;
        }
    }
    </script>
</body>
</html>
